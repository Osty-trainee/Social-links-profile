<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main>
    <div class="card">

      <div class="card-picture">
        <img src="./assets/images/avatar-jessica.jpeg" alt="avatar-jessica">
      </div>

      <div class="card-name-location">
        <h1 class="card-name">Jessica Randall</h1>
        <p class="card-location">London, United Kingdom</p>
      </div>

      <div class="card-bio">
        <p>"Front-end developer and avid reader."</p>
      </div>
      
      <nav class="card-links">
        <ul>
          <li><a href="https://github.com/Osty-trainee" target="_blank" class="profile-link">GitHub</a></li>
          <li><a href="https://www.frontendmentor.io/profile/Osty-trainee" target="_blank" class="profile-link">Frontend Mentor</a></li>
          <li><a href="https://www.linkedin.com" target="_blank" class="profile-link">LinkedIn</a></li>
          <li><a href="https://www.twitter.com" target="_blank" class="profile-link">Twitter</a></li>
          <li><a href="https://www.instagram.com" target="_blank" class="profile-link">Instagram</a></li>  
        </ul>
      </nav>

    </div>
  </main>
 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/Osty-trainee">Osty</a>
  </footer>
</body>
</html>
